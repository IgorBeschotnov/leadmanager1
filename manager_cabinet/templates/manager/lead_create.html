{% extends "manager/base.html" %}
{% block title %}Новий лід{% endblock %}
{% block page_title %}Новий лід{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{% url 'manager:tasks' %}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Назад
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header bg-white fw-semibold">
        <i class="bi bi-plus-circle"></i> Створити картку ліда
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}

          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Назва компанії <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required placeholder="ТОВ «Приклад»">
            </div>
            <div class="col-md-4">
              <label class="form-label">Статус</label>
              <select name="stage" class="form-select">
                <option value="in_progress">В роботі</option>
                <option value="letter_sent">Чекає відправки КП</option>
                <option value="success">Партнер</option>
                <option value="refusal">Відмова</option>
                <option value="invalid">Невалідний</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Телефони</label>
              <input type="text" name="phones" class="form-control" placeholder="+380..., +380...">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="text" name="emails" class="form-control" placeholder="info@example.com">
            </div>

            <div class="col-md-6">
              <label class="form-label">Місто</label>
              <input type="text" name="city" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Область / регіон</label>
              <input type="text" name="region" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Адреса</label>
              <input type="text" name="address" class="form-control" placeholder="Вулиця, будинок, офіс">
            </div>

            <div class="col-md-6">
              <label class="form-label">Контактна особа</label>
              <input type="text" name="contact_person" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Канал (Telegram / Viber / Email)</label>
              <input type="text" name="preferred_channel" class="form-control" placeholder="Telegram">
            </div>

            <div class="col-12">
              <label class="form-label">Внутрішні нотатки</label>
              <div class="note-toolbar" role="group" aria-label="Колір виділення нотаток">
                <button type="button" class="note-color-button" data-note-color="red" aria-label="Червоний" title="Червоний">A</button>
                <button type="button" class="note-color-button" data-note-color="orange" aria-label="Помаранчевий" title="Помаранчевий">A</button>
                <button type="button" class="note-color-button" data-note-color="yellow" aria-label="Жовтий" title="Жовтий">A</button>
                <button type="button" class="note-color-button" data-note-color="green" aria-label="Зелений" title="Зелений">A</button>
                <button type="button" class="note-color-button" data-note-color="blue" aria-label="Синій" title="Синій">A</button>
              </div>
              <div class="note-editor form-control" contenteditable="true" data-placeholder="Що важливо знати про цю компанію"></div>
              <input type="hidden" name="internal_notes" class="note-editor-value">
            </div>
          </div>

          <hr class="my-4">

          <h6 class="mb-3">Результат дзвінка (якщо вже телефонували)</h6>
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label">Результат</label>
              <select name="call_result" class="form-select">
                <option value="">— не вказувати —</option>
                <option value="success">Позитивно (чекає КП / згоден)</option>
                <option value="call_back">Перетелефонувати пізніше</option>
                <option value="refusal">Відмова</option>
                <option value="wrong_number">Невірний номер / немає зв'язку</option>
              </select>
            </div>
            <div class="col-md-7">
              <label class="form-label">Коментар до дзвінка</label>
              <input type="text" name="call_comment" class="form-control" placeholder="Коротко: що сказали">
            </div>
          </div>

          <div class="mt-4 d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-check2-circle"></i> Створити картку
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  const colors = {red:'#c0392b',orange:'#c45b16',yellow:'#947000',green:'#23734b',blue:'#245fbb'};
  document.querySelectorAll('.note-editor').forEach(function (editor) {
    const form = editor.closest('form');
    const hidden = form.querySelector('.note-editor-value');
    form.querySelectorAll('.note-color-button').forEach(function (button) {
      button.addEventListener('mousedown', function (event) { event.preventDefault(); });
      button.addEventListener('click', function () {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed || !editor.contains(selection.anchorNode)) return;
        const span = document.createElement('span');
        span.dataset.noteColor = button.dataset.noteColor;
        span.style.color = colors[button.dataset.noteColor];
        try { selection.getRangeAt(0).surroundContents(span); } catch (_) { const range=selection.getRangeAt(0); span.appendChild(range.extractContents()); range.insertNode(span); }
        selection.removeAllRanges();
        editor.focus();
      });
    });
    form.addEventListener('submit', function () { hidden.value = editor.innerHTML; });
  });
})();
</script>
{% endblock %}
